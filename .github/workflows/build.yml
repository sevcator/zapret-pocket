name: Build Module

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-zapret:
    name: zapret for Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            output: nfqws-arm
          - abi: arm64-v8a
            target: aarch64-linux-android
            output: nfqws-aarch64
          - abi: x86
            target: i686-linux-android
            output: nfqws-x86
          - abi: x86_64
            target: x86_64-linux-android
            output: nfqws-x86_x64
    steps:
      - name: Checkout zapret
        uses: actions/checkout@v4
        with:
          repository: bol-van/zapret
          path: zapret

      - name: Build nfqws
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPS_DIR=$GITHUB_WORKSPACE/deps
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export API=21
          export CC="$TOOLCHAIN/bin/clang --target=$TARGET$API"
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$CC
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$DEPS_DIR/lib/pkgconfig

          curl -sSL https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2 | tar -xj
          curl -sSL https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2 | tar -xj
          curl -sSL https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2 | tar -xj
          patch -p1 -d libnetfilter_queue-1.0.5 -i "$GITHUB_WORKSPACE/zapret/.github/workflows/libnetfilter_queue-android.patch"

          for i in libmnl libnfnetlink libnetfilter_queue; do
            (
              cd $i-*
              CFLAGS="-Os -flto=auto -Wno-implicit-function-declaration" ./configure --prefix= --host=$TARGET --enable-static --disable-shared --disable-dependency-tracking
              make install -j$(nproc) DESTDIR=$DEPS_DIR
            )
            sed -i "s|^prefix=.*|prefix=$DEPS_DIR|g" $DEPS_DIR/lib/pkgconfig/$i.pc
          done

          CFLAGS="-DZAPRET_GH_VER=${{ github.ref_name }} -DZAPRET_GH_HASH=${{ github.sha }} -I$DEPS_DIR/include" LDFLAGS="-L$DEPS_DIR/lib" make -C zapret android -j$(nproc)

          ELFCLEANER_TAG="$(gh api repos/termux/termux-elf-cleaner/releases/latest --jq '.tag_name')"
          curl -fsSL -o elf-cleaner "https://github.com/termux/termux-elf-cleaner/releases/download/${ELFCLEANER_TAG}/termux-elf-cleaner"
          chmod +x elf-cleaner
          ./elf-cleaner --api-level 21 zapret/binaries/my/*
          mv zapret/binaries/my/nfqws "$PWD/${{ matrix.output }}"

      - name: Upload nfqws artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  build-dnscrypt:
    name: dnscrypt-proxy for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dnscrypt-proxy
        uses: actions/checkout@v4
        with:
          repository: DNSCrypt/dnscrypt-proxy
          path: dnscrypt-proxy

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1"
          check-latest: true
          cache-dependency-path: "dnscrypt-proxy/**/go.sum"

      - name: Build dnscrypt-proxy binaries
        run: |
          SRC_DIR="${GITHUB_WORKSPACE}/dnscrypt-proxy"
          if [ -d "${SRC_DIR}/dnscrypt-proxy" ]; then
            SRC_DIR="${SRC_DIR}/dnscrypt-proxy"
          fi
          OUTPUT_DIR="${GITHUB_WORKSPACE}/dnscrypt-proxy/binaries"
          mkdir -p "${OUTPUT_DIR}"

          cd "${SRC_DIR}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/modified-ci-build.sh"
          mv dnscrypt-proxy-* "${OUTPUT_DIR}/"

      - name: Upload dnscrypt-proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnscrypt-proxy
          path: dnscrypt-proxy/binaries/*
          if-no-files-found: error

  build-curl:
    name: curl for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout curl-android
        uses: actions/checkout@v4
        with:
          repository: ibaoger/libcurl-android
          path: curl-android

      - name: Build curl binaries
        run: |
          set -e
          cd curl-android
          git submodule update --init --recursive
          python - <<'PY'
          from pathlib import Path

          ABI_API = {
              'armeabi-v7a)': '21',
              'x86)': '21',
              'arm64-v8a)': '21',
              'x86-64)': '21',
          }

          def patch_file(path: Path) -> None:
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines()
              out: list[str] = []

              for line in lines:
                  stripped = line.strip()
                  if stripped == 'APP_ABI=(armeabi-v7a arm64-v8a x86-64)':
                      out.append('APP_ABI=(armeabi-v7a arm64-v8a x86 x86-64)')
                      continue
                  if stripped == 'export API=21':
                      out.append('export API="${API:-21}"')
                      if path.name == 'compile-openssl.sh':
                          out.append('case "$ARCH" in')
                          out.append('\tandroid-arm) TARGET_TRIPLE=armv7a-linux-androideabi ;;')
                          out.append('\tandroid-x86) TARGET_TRIPLE=i686-linux-android ;;')
                          out.append('\tandroid-arm64) TARGET_TRIPLE=aarch64-linux-android ;;')
                          out.append('\tandroid-x86_64) TARGET_TRIPLE=x86_64-linux-android ;;')
                          out.append('\t*) TARGET_TRIPLE="$ARCH" ;;')
                          out.append('esac')
                          out.append('export CC="$TOOLCHAIN/clang --target=$TARGET_TRIPLE$API"')
                          out.append('export CXX="$TOOLCHAIN/clang++ --target=$TARGET_TRIPLE$API"')
                      continue
                  if stripped == 'export CC=$TOOLCHAIN/$TARGET$API-clang':
                      out.append('export CC="$TOOLCHAIN/clang --target=$TARGET$API"')
                      continue
                  if stripped == 'export CXX=$TOOLCHAIN/$TARGET$API-clang++':
                      out.append('export CXX="$TOOLCHAIN/clang++ --target=$TARGET$API"')
                      continue
                  if stripped == 'export CFLAGS="--sysroot=$SYSROOT $CFLAGS"':
                      out.append('export CFLAGS="--sysroot=$SYSROOT -Wno-error $CFLAGS"')
                      continue
                  if stripped == 'export CFLAGS="-I$SYSROOT/usr/include --sysroot=$SYSROOT $CFLAGS"':
                      out.append('export CFLAGS="-I$SYSROOT/usr/include --sysroot=$SYSROOT -Wno-error $CFLAGS"')
                      continue

                  out.append(line)
                  if stripped in ABI_API:
                      out.append(f'\t\tAPI={ABI_API[stripped]}')

              path.write_text(
                  '\n'.join(out) + ('\n' if original.endswith('\n') else ''),
                  encoding='utf-8',
              )

          patch_file(Path('jni/compile-zlib.sh'))
          patch_file(Path('jni/compile-openssl.sh'))
          patch_file(Path('build_for_android.sh'))

          zlib_configure = Path('jni/zlib/configure')
          if zlib_configure.exists():
              text = zlib_configure.read_text(encoding='utf-8')
              old = (
                  'echo "Checking for obsessive-compulsive compiler options..." >> configure.log\n'
                  'if try $CC -c $CFLAGS $test.c; then\n'
                  '  :\n'
                  'else\n'
                  '  echo "Compiler error reporting is too harsh for $0 (perhaps remove -Werror)." | tee -a configure.log\n'
                  '  leave 1\n'
                  'fi\n'
              )
              new = (
                  'echo "Checking for obsessive-compulsive compiler options..." >> configure.log\n'
                  ': # Android NDK toolchains inject warning-as-error flags that zlib\'s probe rejects\n'
              )
              if old in text:
                  text = text.replace(old, new, 1)
                  zlib_configure.write_text(text, encoding='utf-8')
          PY
          export NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$PATH:$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          chmod +x build_for_android.sh
          ./build_for_android.sh
          mkdir -p binaries
          find jni/build/curl libs -type f -name curl 2>/dev/null | while IFS= read -r file; do
            abi="$(basename "$(dirname "$file")")"
            if [ "$abi" = bin ]; then
              abi="$(basename "$(dirname "$(dirname "$file")")")"
            fi
            case "$abi" in
              arm|armeabi-v7a|armv7a) name="curl-arm" ;;
              arm64|arm64-v8a|aarch64) name="curl-aarch64" ;;
              i386|x86) name="curl-x86" ;;
              x86-64|x86_64|amd64) name="curl-x86_64" ;;
              *) continue ;;
            esac
            cp "$file" "binaries/$name"
          done

      - name: Upload curl artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-binaries
          path: curl-android/binaries/*
          if-no-files-found: error

  validate-and-package:
    name: Validate and package module
    runs-on: ubuntu-latest
    needs: [build-zapret, build-dnscrypt, build-curl]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Determine version info
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Determine version string from tag or generate one from commit count
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"          # e.g. v21.0
            VERSION_BARE="${VERSION#v}"            # e.g. 21.0
          else
            # Not a tag push — use latest tag as base or fallback
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0')"
            COMMIT_COUNT="$(git rev-list --count HEAD)"
            VERSION="${LATEST_TAG}-dev.${COMMIT_COUNT}"
            VERSION_BARE="${VERSION#v}"
          fi

          # versionCode: count of all reachable commits (monotonically increasing)
          VERSION_CODE="$(git rev-list --count HEAD)"

          # Fetch repo description from GitHub API
          DESCRIPTION="$(gh api "repos/${REPO}" --jq '.description // "Zapret module"')"

          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "version_bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "description=${DESCRIPTION}" >> "$GITHUB_OUTPUT"

          echo "Version      : ${VERSION}"
          echo "VersionCode  : ${VERSION_CODE}"
          echo "Description  : ${DESCRIPTION}"

      - name: Patch module.prop
        run: |
          VERSION="${{ steps.version.outputs.version_bare }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          DESCRIPTION="${{ steps.version.outputs.description }}"

          sed -i "s|^version=.*|version=${VERSION}|" module/module.prop
          sed -i "s|^versionCode=.*|versionCode=${VERSION_CODE}|" module/module.prop
          sed -i "s|^description=.*|description=${DESCRIPTION}|" module/module.prop

          echo "=== module.prop ==="
          cat module/module.prop

      - name: Patch update.json
        run: |
          VERSION="${{ steps.version.outputs.version_bare }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          REPO="${{ github.repository }}"

          # Determine the tag to use in the download URL
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ZIP_TAG="${GITHUB_REF_NAME}"
          else
            ZIP_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo main)"
          fi

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": "${VERSION_CODE}",
            "zipUrl": "https://github.com/${REPO}/releases/download/${ZIP_TAG}/zapret-pocket.zip",
            "changelog": "https://raw.githubusercontent.com/${REPO}/main/CHANGELOG.md"
          }
          EOF

          echo "=== update.json ==="
          cat update.json

      - name: Generate CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import os
          import json
          import urllib.request

          repo   = os.environ["REPO"]
          token  = os.environ["GH_TOKEN"]
          base   = f"https://api.github.com/repos/{repo}"
          hdrs   = {
              "Accept":               "application/vnd.github+json",
              "Authorization":        f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def gh(path):
              url = f"{base}{path}?per_page=100"
              req = urllib.request.Request(url, headers=hdrs)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # Fetch all tags sorted by creation (newest first)
          tags_raw = subprocess.check_output(
              ["git", "tag", "--sort=-creatordate"], text=True
          ).splitlines()

          if not tags_raw:
              print("No tags found, writing empty changelog body.")
              body = ""
          else:
              releases = {r["tag_name"]: r for r in gh("/releases")}
              lines = []

              for i, tag in enumerate(tags_raw):
                  # Full release name (falls back to tag if no release found)
                  rel = releases.get(tag, {})
                  release_name = rel.get("name") or tag

                  # Commit range for this tag
                  prev_tag = tags_raw[i + 1] if i + 1 < len(tags_raw) else None
                  if prev_tag:
                      rev_range = f"{prev_tag}..{tag}"
                  else:
                      rev_range = tag

                  commits_raw = subprocess.check_output(
                      ["git", "log", rev_range, "--format=%H %s"],
                      text=True
                  ).splitlines()

                  lines.append(f"**{release_name}**")
                  if commits_raw:
                      for entry in commits_raw:
                          parts = entry.split(" ", 1)
                          sha   = parts[0]
                          msg   = parts[1] if len(parts) > 1 else sha
                          short = sha[:7]
                          url   = f"https://github.com/{repo}/commit/{sha}"
                          lines.append(f"- [{msg} ({short})]({url})")
                  else:
                      lines.append("- No commits in this release")

                  lines.append("")  # blank line between releases

              body = "\n".join(lines).rstrip()

          # Static links header (preserved from existing CHANGELOG.md)
          header = """\
          [📢 Telegram Channel](https://t.me/sevcator/921)

          [📁 Repository](https://github.com/sevcator/zapret-pocket/)

          [📖 Report Issues](https://github.com/sevcator/zapret-pocket/issues)

          [💸 Donate](https://t.me/sevcator/909)

          [👓 Author](https://github.com/sevcator/)
          """

          import textwrap
          header = textwrap.dedent(header)

          content = header + "\n" + body + "\n" if body else header
          with open("CHANGELOG.md", "w", encoding="utf-8") as f:
              f.write(content)

          print("=== CHANGELOG.md ===")
          print(content)
          PYEOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download upstream archive
        run: |
          curl -L -o flowseal-upstream.zip https://github.com/Flowseal/zapret-discord-youtube/archive/refs/heads/main.zip

      - name: Sync module assets from upstream zip
        run: |
          python .github/scripts/generate-assets.py

      - name: Validate shell syntax
        run: |
          find module -type f \( -name "*.sh" -o -path "module/system/bin/zapret" \) -print0 | xargs -0 -n1 sh -n

      - name: Download nfqws armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: nfqws-arm
          path: artifacts/nfqws-arm

      - name: Download nfqws arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: nfqws-aarch64
          path: artifacts/nfqws-aarch64

      - name: Download nfqws x86
        uses: actions/download-artifact@v4
        with:
          name: nfqws-x86
          path: artifacts/nfqws-x86

      - name: Download nfqws x86_64
        uses: actions/download-artifact@v4
        with:
          name: nfqws-x86_x64
          path: artifacts/nfqws-x86_x64

      - name: Download dnscrypt-proxy
        uses: actions/download-artifact@v4
        with:
          name: dnscrypt-proxy
          path: artifacts/dnscrypt-proxy

      - name: Download curl binaries
        uses: actions/download-artifact@v4
        with:
          name: curl-binaries
          path: artifacts/curl

      - name: Download latest VpnHotspot APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          api_url = "https://api.github.com/repos/Mygod/VPNHotspot/releases"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          request = Request(api_url, headers=headers)
          with urlopen(request) as response:
              releases = json.load(response)

          asset = None
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              for candidate in release.get("assets", []):
                  name = candidate.get("name", "")
                  if name.startswith("vpnhotspot-v") and name.endswith(".apk"):
                      asset = candidate
                      break
              if asset is not None:
                  break

          if asset is None:
              raise SystemExit("Stable VpnHotspot APK asset was not found")

          output_dir = Path("artifacts") / "vpnhotspot"
          output_dir.mkdir(parents=True, exist_ok=True)
          output_path = output_dir / "VpnHotspot.apk"

          download_request = Request(asset["browser_download_url"], headers=headers)
          with urlopen(download_request) as response:
              output_path.write_bytes(response.read())

          print(f"Downloaded {asset['name']} from {asset['browser_download_url']}")
          PY

      - name: Add binaries to module layout
        run: |
          mkdir -p module/zapret module/dnscrypt module/system/app
          mv artifacts/nfqws-arm/nfqws-arm module/zapret/nfqws-arm
          mv artifacts/nfqws-aarch64/nfqws-aarch64 module/zapret/nfqws-aarch64
          mv artifacts/nfqws-x86/nfqws-x86 module/zapret/nfqws-x86
          mv artifacts/nfqws-x86_x64/nfqws-x86_x64 module/zapret/nfqws-x86_x64
          mv artifacts/dnscrypt-proxy/* module/dnscrypt/
          mv artifacts/curl/* module/
          mv artifacts/vpnhotspot/VpnHotspot.apk module/system/app/VpnHotspot.apk
          chmod +x module/zapret/*.sh module/zapret/nfqws-* module/dnscrypt/dnscrypt-proxy-* module/dnscrypt/*.sh module/curl-* 2>/dev/null || true

      - name: Package module zip
        run: |
          cd module
          find . -type d -empty -delete
          zip -r ../zapret-pocket.zip .

      - name: Upload module zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-pocket
          path: zapret-pocket.zip
          if-no-files-found: error

      - name: Commit updated files back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module/module.prop update.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update version, changelog, update.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || git push origin HEAD:main
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${{ steps.version.outputs.version_bare }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          # Use tag if triggered by tag push, otherwise use a rolling "latest" tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="${TAG}"
          else
            TAG="latest"
            RELEASE_NAME="Latest build ($(date -u '+%Y-%m-%d'))"
            # Create or move the rolling tag
            git tag -f "${TAG}"
            git push origin -f "refs/tags/${TAG}"
          fi

          # Build release notes from CHANGELOG.md (skip the static header links)
          NOTES="$(python3 - <<'PYEOF'
          import re, sys
          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          # Drop the static link lines at the top
          text = re.sub(r'^\[.*?\]\(.*?\)\n\n', '', text, flags=re.MULTILINE)
          # Strip leading blank lines
          text = text.lstrip('\n')
          print(text, end='')
          PYEOF
          )"

          # Delete existing release with this tag if present, then recreate
          gh release delete "${TAG}" --repo "${REPO}" --yes 2>/dev/null || true

          gh release create "${TAG}" --repo "${REPO}" --title "${RELEASE_NAME}" --notes "${NOTES}" zapret-pocket.zip
