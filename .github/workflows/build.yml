name: Build Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-zapret:
    name: zapret for Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            output: nfqws-arm
          - abi: arm64-v8a
            target: aarch64-linux-android
            output: nfqws-aarch64
          - abi: x86
            target: i686-linux-android
            output: nfqws-x86
          - abi: x86_64
            target: x86_64-linux-android
            output: nfqws-x86_x64
    steps:
      - name: Checkout zapret
        uses: actions/checkout@v4
        with:
          repository: bol-van/zapret
          path: zapret

      - name: Build nfqws
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          DEPS_DIR=$GITHUB_WORKSPACE/deps
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export API=21
          export CC="$TOOLCHAIN/bin/clang --target=$TARGET$API"
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$CC
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$DEPS_DIR/lib/pkgconfig

          curl -sSL https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2 | tar -xj
          curl -sSL https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2 | tar -xj
          curl -sSL https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2 | tar -xj
          curl -sSL https://raw.githubusercontent.com/bol-van/zapret/master/.github/workflows/libnetfilter_queue-android.patch | patch -p1 -d libnetfilter_queue-1.0.5

          for i in libmnl libnfnetlink libnetfilter_queue; do
            (
              cd $i-*
              CFLAGS="-Os -flto=auto -Wno-implicit-function-declaration" \
              ./configure --prefix= --host=$TARGET --enable-static --disable-shared --disable-dependency-tracking
              make install -j$(nproc) DESTDIR=$DEPS_DIR
            )
            sed -i "s|^prefix=.*|prefix=$DEPS_DIR|g" $DEPS_DIR/lib/pkgconfig/$i.pc
          done

          CFLAGS="-DZAPRET_GH_VER=${{ github.ref_name }} -DZAPRET_GH_HASH=${{ github.sha }} -I$DEPS_DIR/include" \
          LDFLAGS="-L$DEPS_DIR/lib" \
          make -C zapret android -j$(nproc)
          mv zapret/binaries/my/nfqws "$PWD/${{ matrix.output }}"

      - name: Upload nfqws artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  build-dnscrypt:
    name: dnscrypt-proxy for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dnscrypt-proxy
        uses: actions/checkout@v4
        with:
          repository: DNSCrypt/dnscrypt-proxy
          path: dnscrypt-proxy

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1"
          check-latest: true
          cache-dependency-path: "dnscrypt-proxy/**/go.sum"

      - name: Build dnscrypt-proxy binaries
        run: |
          cd dnscrypt-proxy
          if [ -d dnscrypt-proxy ]; then
            cd dnscrypt-proxy
          fi
          bash "${GITHUB_WORKSPACE}/.github/scripts/modified-ci-build.sh"
          mkdir -p binaries
          mv dnscrypt-proxy-* binaries/

      - name: Upload dnscrypt-proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnscrypt-proxy
          path: dnscrypt-proxy/dnscrypt-proxy/binaries/*
          if-no-files-found: error

  validate-and-package:
    name: Validate and package module
    runs-on: ubuntu-latest
    needs: [build-zapret, build-dnscrypt]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download upstream archive
        run: |
          curl -L -o flowseal-upstream.zip https://github.com/Flowseal/zapret-discord-youtube/archive/refs/heads/main.zip

      - name: Sync module assets from upstream zip
        run: |
          python .github/scripts/generate-assets.py --root . --source-zip flowseal-upstream.zip --manifest assets.json

      - name: Download nfqws armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: nfqws-arm
          path: artifacts/nfqws-arm

      - name: Download nfqws arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: nfqws-aarch64
          path: artifacts/nfqws-aarch64

      - name: Download nfqws x86
        uses: actions/download-artifact@v4
        with:
          name: nfqws-x86
          path: artifacts/nfqws-x86

      - name: Download nfqws x86_64
        uses: actions/download-artifact@v4
        with:
          name: nfqws-x86_x64
          path: artifacts/nfqws-x86_x64

      - name: Download dnscrypt-proxy
        uses: actions/download-artifact@v4
        with:
          name: dnscrypt-proxy
          path: artifacts/dnscrypt-proxy

      - name: Add binaries to module layout
        run: |
          mv artifacts/nfqws-arm/nfqws-arm nfqws-arm
          mv artifacts/nfqws-aarch64/nfqws-aarch64 nfqws-aarch64
          mv artifacts/nfqws-x86/nfqws-x86 nfqws-x86
          mv artifacts/nfqws-x86_x64/nfqws-x86_x64 nfqws-x86_x64
          mkdir -p dnscrypt
          mv artifacts/dnscrypt-proxy/* dnscrypt/

      - name: Update module.prop, txt, bin, and sh files in main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Letting git handle the double-star wildcards, splitting to prevent unmatched path errors
          git add module.prop 2>/dev/null || true
          git add "**/*.txt" 2>/dev/null || true
          git add bin/ fake/ 2>/dev/null || true
          git add "**/*.sh" 2>/dev/null || true
          git add "**/*.bin" 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update module assets [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Package module zip
        run: |
          if [ -d "module" ]; then
            cd module
            zip -r ../zapret-magisk.zip .
          else
            python .github/scripts/generate-assets.py --root . --source-zip flowseal-upstream.zip --manifest assets.json --zip-out zapret-magisk.zip
          fi

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: assets-manifest
          path: assets.json

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: zapret-magisk
          path: zapret-magisk.zip
