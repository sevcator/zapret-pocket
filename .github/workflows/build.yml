name: Build Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build-zapret:
    name: zapret for Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            output: nfqws-arm
          - abi: arm64-v8a
            target: aarch64-linux-android
            output: nfqws-aarch64
          - abi: x86
            target: i686-linux-android
            output: nfqws-x86
          - abi: x86_64
            target: x86_64-linux-android
            output: nfqws-x86_x64
    steps:
      - name: Checkout zapret
        uses: actions/checkout@v4
        with:
          repository: bol-van/zapret
          path: zapret

      - name: Build nfqws
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPS_DIR=$GITHUB_WORKSPACE/deps
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export API=21
          export CC="$TOOLCHAIN/bin/clang --target=$TARGET$API"
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$CC
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$DEPS_DIR/lib/pkgconfig

          curl -sSL https://www.netfilter.org/pub/libnfnetlink/libnfnetlink-1.0.2.tar.bz2 | tar -xj
          curl -sSL https://www.netfilter.org/pub/libmnl/libmnl-1.0.5.tar.bz2 | tar -xj
          curl -sSL https://www.netfilter.org/pub/libnetfilter_queue/libnetfilter_queue-1.0.5.tar.bz2 | tar -xj
          patch -p1 -d libnetfilter_queue-1.0.5 -i "$GITHUB_WORKSPACE/zapret/.github/workflows/libnetfilter_queue-android.patch"

          for i in libmnl libnfnetlink libnetfilter_queue; do
            (
              cd $i-*
              CFLAGS="-Os -flto=auto -Wno-implicit-function-declaration" \
              ./configure --prefix= --host=$TARGET --enable-static --disable-shared --disable-dependency-tracking
              make install -j$(nproc) DESTDIR=$DEPS_DIR
            )
            sed -i "s|^prefix=.*|prefix=$DEPS_DIR|g" $DEPS_DIR/lib/pkgconfig/$i.pc
          done

          CFLAGS="-DZAPRET_GH_VER=${{ github.ref_name }} -DZAPRET_GH_HASH=${{ github.sha }} -I$DEPS_DIR/include" \
          LDFLAGS="-L$DEPS_DIR/lib" \
          make -C zapret android -j$(nproc)

          ELFCLEANER_TAG="$(gh api repos/termux/termux-elf-cleaner/releases/latest --jq '.tag_name')"
          curl -fsSL -o elf-cleaner "https://github.com/termux/termux-elf-cleaner/releases/download/${ELFCLEANER_TAG}/termux-elf-cleaner"
          chmod +x elf-cleaner
          ./elf-cleaner --api-level 21 zapret/binaries/my/*
          mv zapret/binaries/my/nfqws "$PWD/${{ matrix.output }}"

      - name: Upload nfqws artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  build-dnscrypt:
    name: dnscrypt-proxy for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dnscrypt-proxy
        uses: actions/checkout@v4
        with:
          repository: DNSCrypt/dnscrypt-proxy
          path: dnscrypt-proxy

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1"
          check-latest: true
          cache-dependency-path: "dnscrypt-proxy/**/go.sum"

      - name: Build dnscrypt-proxy binaries
        run: |
          SRC_DIR="${GITHUB_WORKSPACE}/dnscrypt-proxy"
          if [ -d "${SRC_DIR}/dnscrypt-proxy" ]; then
            SRC_DIR="${SRC_DIR}/dnscrypt-proxy"
          fi
          OUTPUT_DIR="${GITHUB_WORKSPACE}/dnscrypt-proxy/binaries"
          mkdir -p "${OUTPUT_DIR}"

          cd "${SRC_DIR}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/modified-ci-build.sh"
          mv dnscrypt-proxy-* "${OUTPUT_DIR}/"

      - name: Upload dnscrypt-proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnscrypt-proxy
          path: dnscrypt-proxy/binaries/*
          if-no-files-found: error

  build-curl:
    name: curl for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout curl-android
        uses: actions/checkout@v4
        with:
          repository: ibaoger/libcurl-android
          path: curl-android

      - name: Build curl binaries
        run: |
          set -e
          cd curl-android
          git submodule update --init --recursive
          python - <<'PY'
          from pathlib import Path

          ABI_API = {
              'armeabi-v7a)': '19',
              'x86)': '19',
              'arm64-v8a)': '21',
              'x86-64)': '21',
          }

          def patch_file(path: Path) -> None:
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines()
              out: list[str] = []

              for line in lines:
                  stripped = line.strip()
                  if stripped == 'APP_ABI=(armeabi-v7a arm64-v8a x86-64)':
                      out.append('APP_ABI=(armeabi-v7a arm64-v8a x86 x86-64)')
                      continue
                  if stripped == 'export API=21':
                      out.append('export API="${API:-21}"')
                      continue
                  if stripped == 'export CFLAGS="--sysroot=$SYSROOT $CFLAGS"':
                      out.append('export CFLAGS="--sysroot=$SYSROOT -Wno-error $CFLAGS"')
                      continue
                  if stripped == 'export CFLAGS="-I$SYSROOT/usr/include --sysroot=$SYSROOT $CFLAGS"':
                      out.append('export CFLAGS="-I$SYSROOT/usr/include --sysroot=$SYSROOT -Wno-error $CFLAGS"')
                      continue

                  out.append(line)
                  if stripped in ABI_API:
                      out.append(f'\t\tAPI={ABI_API[stripped]}')

              path.write_text(
                  '\n'.join(out) + ('\n' if original.endswith('\n') else ''),
                  encoding='utf-8',
              )

          patch_file(Path('jni/compile-zlib.sh'))
          patch_file(Path('jni/compile-openssl.sh'))
          patch_file(Path('build_for_android.sh'))
          PY
          export NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$PATH:$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          chmod +x build_for_android.sh
          ./build_for_android.sh
          mkdir -p binaries
          find jni/build/curl libs -type f -name curl 2>/dev/null | while IFS= read -r file; do
            abi="$(basename "$(dirname "$file")")"
            if [ "$abi" = bin ]; then
              abi="$(basename "$(dirname "$(dirname "$file")")")"
            fi
            case "$abi" in
              arm|armeabi-v7a|armv7a) name="curl-arm" ;;
              arm64|arm64-v8a|aarch64) name="curl-aarch64" ;;
              i386|x86) name="curl-x86" ;;
              x86-64|x86_64|amd64) name="curl-x86_64" ;;
              *) continue ;;
            esac
            cp "$file" "binaries/$name"
          done

      - name: Upload curl artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-binaries
          path: curl-android/binaries/*
          if-no-files-found: error

  validate-and-package:
    name: Validate and package module
    runs-on: ubuntu-latest
    needs: [build-zapret, build-dnscrypt, build-curl]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked module sources
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          blocked_names = {
              "dnscrypt-proxy-arm",
              "dnscrypt-proxy-arm64",
              "dnscrypt-proxy-i386",
              "dnscrypt-proxy-x86_64",
          }
          blocked_exts = {".apk", ".bin", ".dll", ".exe", ".so", ".sys"}

          result = subprocess.run(
              ["git", "ls-files", "module"],
              check=True,
              capture_output=True,
              text=True,
          )

          violations: list[str] = []

          for rel in [line.strip() for line in result.stdout.splitlines() if line.strip()]:
              path = Path(rel)
              if path.name in blocked_names or path.suffix.lower() in blocked_exts:
                  violations.append(rel)
                  continue

              blob = subprocess.run(
                  ["git", "show", f"HEAD:{rel}"],
                  check=True,
                  capture_output=True,
              ).stdout

              if b"\x00" in blob:
                  violations.append(rel)
                  continue

              try:
                  blob.decode("utf-8")
              except UnicodeDecodeError:
                  violations.append(rel)

          if violations:
              print("Blocked binary files found in tracked module sources:", file=sys.stderr)
              for rel in violations:
                  print(f" - {rel}", file=sys.stderr)
              sys.exit(1)

          print("Module source tree contains no tracked binaries.")
          PY

      - name: Download upstream archive
        run: |
          curl -L -o flowseal-upstream.zip https://github.com/Flowseal/zapret-discord-youtube/archive/refs/heads/main.zip

      - name: Sync module assets from upstream zip
        run: |
          python .github/scripts/generate-assets.py

      - name: Validate shell syntax
        run: |
          find module -type f \( -name "*.sh" -o -path "module/system/bin/zapret" \) -print0 | xargs -0 -n1 sh -n

      - name: Download nfqws armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: nfqws-arm
          path: artifacts/nfqws-arm

      - name: Download nfqws arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: nfqws-aarch64
          path: artifacts/nfqws-aarch64

      - name: Download nfqws x86
        uses: actions/download-artifact@v4
        with:
          name: nfqws-x86
          path: artifacts/nfqws-x86

      - name: Download nfqws x86_64
        uses: actions/download-artifact@v4
        with:
          name: nfqws-x86_x64
          path: artifacts/nfqws-x86_x64

      - name: Download dnscrypt-proxy
        uses: actions/download-artifact@v4
        with:
          name: dnscrypt-proxy
          path: artifacts/dnscrypt-proxy

      - name: Download curl binaries
        uses: actions/download-artifact@v4
        with:
          name: curl-binaries
          path: artifacts/curl

      - name: Add binaries to module layout
        run: |
          mkdir -p module/zapret module/dnscrypt
          mv artifacts/nfqws-arm/nfqws-arm module/zapret/nfqws-arm
          mv artifacts/nfqws-aarch64/nfqws-aarch64 module/zapret/nfqws-aarch64
          mv artifacts/nfqws-x86/nfqws-x86 module/zapret/nfqws-x86
          mv artifacts/nfqws-x86_x64/nfqws-x86_x64 module/zapret/nfqws-x86_x64
          mv artifacts/dnscrypt-proxy/* module/dnscrypt/
          mv artifacts/curl/* module/
          chmod +x module/zapret/*.sh module/zapret/nfqws-* module/dnscrypt/dnscrypt-proxy-* module/dnscrypt/*.sh module/curl-* 2>/dev/null || true

      - name: Package module zip
        run: |
          cd module
          zip -r ../zapret-magisk.zip .

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: zapret-magisk
          path: zapret-magisk.zip
